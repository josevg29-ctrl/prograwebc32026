<!doctype html>
<html lang="es" data-bs-theme="light">
  <head>
    <title>Crear Pago</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  <link rel="stylesheet" href="estilos.css">
</head>

  <body>
    <div class="container">
      <header>
        <ul class="nav justify-content-center">
          <li class="nav-item">
            <a class="nav-link active" href="index.html" aria-current="page"
              >Inicio</a
            >
          </li>
          
          <li class="nav-item">
            <a
              class="nav-link"
              href="https://paginas-web-cr.com/Api/form/consultapago.php"
              target="_blank"
              >Mostrar Pagos</a
            >
          </li>
          <li class="nav-item">
            <a
              class="nav-link"
              href="pago.html"
              target="_blank"
              >Crear Pagos</a
            >
          </li>
          <li class="nav-item">
            <a
              class="nav-link"
              href="editarpago.html"
              target="_blank"
              >Editar Pagos</a
            >
          </li>
        </ul>
      </header>
      <main>
        <div class="container">
          <h1>Crear Pago</h1>
        </div>

        <div class="container">
          <form
            action="https://paginas-web-cr.com/Api/form/crearpago.php"
            method="post"
          >
            <div class="mb-3">
              <label for="id_factura" class="form-label">ID Factura</label>
              <input
                type="text"
                class="form-control"
                name="id_factura"
                id="id_factura"
                aria-describedby="helpId"
                placeholder="Ingrese el ID de la factura"
                required
              />
            </div>
            <div class="mb-3">
              <label for="monto" class="form-label">Monto</label>
              <input
                type="number"
                step="any"
                class="form-control"
                name="monto"
                id="monto"
                aria-describedby="helpId"
                placeholder="Ingrese el monto"
                required
              />
            </div>
            <div class="mb-3">
              <label for="metodo" class="form-label">Método</label>
              <input
                type="text"
                class="form-control"
                name="metodo"
                id="metodo"
                aria-describedby="helpId"
                placeholder="Ejemplo: tarjeta, efectivo, sinpe"
                required
              />
            </div>
            <div class="mb-3">
              <label for="detalle" class="form-label">Detalle</label>
              <input
                type="text"
                class="form-control"
                name="detalle"
                id="detalle"
                aria-describedby="helpId"
                placeholder="Ingrese el detalle del pago"
                required
              />
            </div>
            <div class="mb-3">
              <label for="usuario" class="form-label">Usuario</label>
              <input
                type="text"
                class="form-control"
                name="usuario"
                id="usuario"
                aria-describedby="helpId"
                placeholder="Ingrese el usuario"
                required
              />
            </div>
            <div class="mb-3">
              <button type="submit" class="btn btn-primary">Enviar</button>
              <button type="reset" class="btn btn-danger">Reset</button>
            </div>
            <p>
              Método: POST id_factura monto metodo detalle usuario
              https://paginas-web-cr.com/Api/form/crearpago.php
            </p>
          </form>
        </div>
      </main>
      <footer>sistema de gestión y venta de cursos · jose viquez</footer>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
