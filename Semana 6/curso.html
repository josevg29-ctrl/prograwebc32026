<!doctype html>
<html lang="es" data-bs-theme="light">
  <head>
    <title>Crear Curso</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="estilos.css">
  </head>

  <body>
    <div class="container">
      <header>
        <ul class="nav justify-content-center">
          <li class="nav-item">
            <a class="nav-link active" href="index.html" aria-current="page">Inicio</a>
          </li>
          <li class="nav-item">
            <a
              class="nav-link"
              href="https://paginas-web-cr.com/Api/form/consultarcurso.php"
              target="_blank"
              >Mostrar Cursos</a
            >
          </li>
          <li class="nav-item">
            <a class="nav-link" href="curso.html">Crear Cursos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="editarcurso.html">Editar Cursos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="eliminarcurso.html">Eliminar Cursos</a>
          </li>
        </ul>
      </header>
      <main>
        <div class="container">
          <h1>Crear Curso</h1>
        </div>

        <div class="container">
          <form
            action="https://paginas-web-cr.com/Api/form/crearcurso.php"
            method="post"
          >
            <div class="mb-3">
              <label for="nombre" class="form-label">Nombre</label>
              <input
                type="text"
                class="form-control"
                name="nombre"
                id="nombre"
                aria-describedby="helpId"
                placeholder="Ingrese el nombre del curso"
                required
              />
            </div>
            <div class="mb-3">
              <label for="descripcion" class="form-label">Descripción</label>
              <input
                type="text"
                class="form-control"
                name="descripcion"
                id="descripcion"
                aria-describedby="helpId"
                placeholder="Ingrese la descripción del curso"
                required
              />
            </div>
            <div class="mb-3">
              <label for="tiempo" class="form-label">Tiempo</label>
              <input
                type="text"
                class="form-control"
                name="tiempo"
                id="tiempo"
                aria-describedby="helpId"
                placeholder="Ej: 40 horas"
                required
              />
            </div>
            <div class="mb-3">
              <label for="usuario" class="form-label">Usuario</label>
              <input
                type="text"
                class="form-control"
                name="usuario"
                id="usuario"
                aria-describedby="helpId"
                placeholder="Ingrese su usuario"
                required
              />
            </div>
            <div class="mb-3">
              <input
                type="hidden"
                class="form-control"
                name="return_url"
                id="return_url"
                value="http://127.0.0.1:5500/Semana%206/curso.html"
              />
            </div>
            <div class="mb-3">
              <button type="submit" class="btn btn-primary">Enviar</button>
              <button type="reset" class="btn btn-danger">Reset</button>
            </div>
            <p>
              Método: POST nombre descripcion tiempo usuario return_url
              https://paginas-web-cr.com/Api/form/crearcurso.php
            </p>
          </form>
        </div>
      </main>
      <footer>sistema de gestión y venta de cursos · jose viquez</footer>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
